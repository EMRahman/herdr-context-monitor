id = "context-monitor"
name = "Agent Context Monitor"
version = "0.2.0"
min_herdr_version = "0.7.5"
description = "Shows how full each agent's context window is, right under it in the sidebar, red above 50%: Claude Code, Codex and Antigravity CLI"
platforms = ["macos", "linux"]

[[actions]]
id = "refresh"
title = "Refresh Context Metrics"
command = ["python3", "monitor.py", "--once"]

[[startup]]
command = ["python3", "monitor.py"]
