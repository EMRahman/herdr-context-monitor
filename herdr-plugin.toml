id = "context-monitor"
name = "Agent Context Monitor"
version = "0.2.0"
min_herdr_version = "0.7.5"
description = "A minimal context meter: one Python file that shows each agent's context-window use in the sidebar, for Claude Code, Codex and Antigravity CLI"
platforms = ["macos", "linux"]

[[actions]]
id = "refresh"
title = "Refresh Context Metrics"
command = ["python3", "monitor.py", "--once"]

[[startup]]
command = ["python3", "monitor.py"]
